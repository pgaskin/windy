import net.pgaskin.windy.gradle.CargoBuildTask
import net.pgaskin.windy.gradle.GenerateLicensesTask
import net.pgaskin.windy.gradle.GenerateThemesTask

plugins {
    id 'com.android.application'
}

android {
    namespace = 'net.pgaskin.windy'
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "net.pgaskin.windy"
        minSdk 30
        targetSdk 36
        versionCode 8
        versionName "8"

        buildConfigField "String", "WIND_FIELD_API_URL", "\"https://windy.api.pgaskin.net/wind_cache.png?filter=1\""
        buildConfigField "long", "WIND_FIELD_UPDATE_INTERVAL", "360" // min
        buildConfigField "long", "WIND_FIELD_UPDATE_INTERVAL_MINIMUM", "15" // min

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        eng {
            signingConfig = signingConfigs.debug
            buildConfigField "long", "WIND_FIELD_UPDATE_INTERVAL", "15" // min
            buildConfigField "long", "WIND_FIELD_UPDATE_INTERVAL_STARTUP", "1" // min
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // ensure the git state doesn't affect the build reproducibility
            vcsInfo.include = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.toVersion("11")
        targetCompatibility = JavaVersion.toVersion("11")
    }

    buildFeatures {
        buildConfig = true
    }

    // exclude the dependency-metadata blob in the signing block since it's
    // non-deterministic
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

// pin the toolchain for reproducible builds (and match f-droid and github
// actions)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def cap = variant.name.substring(0, 1).toUpperCase() + variant.name.substring(1)
    def genThemes = tasks.register("generate${cap}Themes", GenerateThemesTask) {
        themeConfig.set(rootProject.file("core/src/config.rs"))
    }
    variant.sources.java?.addGeneratedSourceDirectory(genThemes) { it.javaOutputDir }
    variant.sources.res?.addGeneratedSourceDirectory(genThemes) { it.resOutputDir }
    variant.sources.manifests.addGeneratedManifestFile(genThemes) { it.manifestOutput }

    def genLicenses = tasks.register("generate${cap}Licenses", GenerateLicensesTask) {
        cargoLock.set(rootProject.file("Cargo.lock"))
        crateDir.set(layout.projectDirectory.dir("src/main/rust"))
    }
    variant.sources.assets?.addGeneratedSourceDirectory(genLicenses) { it.assetsOutputDir }

    def cargoBuild = tasks.register("cargoBuild${cap}Native", CargoBuildTask) {
        workspaceDir.set(rootProject.layout.projectDirectory)
        cargoPackage.set("windy-wallpaper-android")
        ndkDirectory.set(androidComponents.sdkComponents.ndkDirectory)
        // pin the toolchain for reproducible builds (the rustc version comes
        // from rust-toolchain.toml, and the ndk one from android.ndkVersion)
        rustToolchainFile.set(rootProject.file("rust-toolchain.toml"))
        cargoNdkVersion.set("4.1.2")
        abiFilters.set(provider {
            Set<String> abis = [] as Set
            if (android.defaultConfig.ndk.abiFilters != null) {
                abis.addAll(android.defaultConfig.ndk.abiFilters)
            }
            android.productFlavors.each { flavor ->
                if (flavor.ndk.abiFilters != null) {
                    abis.addAll(flavor.ndk.abiFilters)
                }
            }
            abis
        })
        minSdkVersion.set(provider {
            def v = android.defaultConfig.minSdk
            (v instanceof com.android.build.api.variant.AndroidVersion) ? v.apiLevel : v
        })
    }
    variant.sources.jniLibs?.addGeneratedSourceDirectory(cargoBuild) { it.outputDir }
}
