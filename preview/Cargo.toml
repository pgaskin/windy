[package]
name = "windy-wallpaper-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Preview and theme editor for the Windy live wallpaper"
repository.workspace = true
keywords = ["wallpaper", "dynamic"]
categories = ["graphics"]

[dependencies]
windy-wallpaper-core = { workspace = true }
wgpu.workspace = true
log.workspace = true
clap.workspace = true
winit = "0.30"
pollster = "1"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["clipboard", "wayland", "x11"] }
